spring:
  application:
    name: ifs18005-springboot-todolist
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: TODOLISTSESSION
        http-only: true

app:
  root-username: ${ROOT_USERNAME}
  root-password: ${ROOT_PASSWORD}
  upload-dir: ${UPLOAD_DIR}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
