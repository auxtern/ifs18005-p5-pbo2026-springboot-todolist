spring:
  application:
    name: ifs18005-springboot-todolist
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbo2026_todolist}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: TODOLISTSESSION
        http-only: true

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
